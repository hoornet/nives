name: "Nives"
version: "2.6.1"
slug: "nives"
description: "AI assistant with cognitive memory for Home Assistant"
url: "https://github.com/hoornet/nives"
image: ghcr.io/hoornet/nives-{arch}
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant: "2024.4.0"
homeassistant_api: true
hassio_api: true
auth_api: true
discovery:
  - nives
map:
  - addon_config:rw
  - config:rw
ports:
  3100/tcp: null
memory: 768
panel_icon: "mdi:brain"
options:
  llm_mode: "cloud"
  cloud:
    api_key: ""
    transcription: false
    voice: "off"
  byok:
    provider: "anthropic"
    api_key: ""
    model: ""
    base_url: ""
  custom_prompt: ""
  log_level: "info"
schema:
  llm_mode: "list(cloud|byok)"
  cloud:
    api_key: "str?"
    transcription: "bool?"
    # The voice Nives speaks replies in, or "off" for no voice at all. Each
    # choice is a voice native to that language, so the list is short and grows
    # only as languages are tested.
    voice: "list(off|slovene_female|slovene_male)?"
  byok:
    provider: "list(anthropic|openai|openrouter|ollama)?"
    api_key: "str?"
    model: "str?"
    base_url: "str?"
  custom_prompt: "str?"
  # Ceiling on one written reply. Left unset, Nives picks its own. Deliberately
  # absent from `options:` above so that "unset" stays a real state rather than
  # a magic number, and so the built-in default can be improved without every
  # existing install being pinned to whatever today's value happens to be.
  max_output_tokens: "int(256,32768)?"
  # Both absent from `options:` for the same reason as max_output_tokens: unset
  # means "Nives decides", which today is the list of entities exposed to Assist.
  layout_from_exposed: "bool?"
  layout_domains: "str?"
  log_level: "list(debug|info|warn|error)"
