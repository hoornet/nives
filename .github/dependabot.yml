version: 2
updates:
  # Bundled conversation server (hard fork of home-mind) — the package that
  # carried the uuid/qs/express advisories. This is the high-value target.
  - package-ecosystem: "npm"
    directory: "/server/src/home-mind-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Roll routine non-security bumps into one PR to cut review noise.
      # Security updates are always opened individually regardless of grouping.
      server-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node tracks the runtime Node (22). Ignore majors so the type
      # defs don't drift ahead of the runtime (e.g. 24) and surface APIs we lack.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # undici 8.11.0 broke Node's own fetch once imported: over HTTP/2 it
      # returned gzip bodies undecoded (empty transcripts, a dead balance check
      # in 2.6.6-2.6.7). Pinned to 8.10.2; src/fetch-decompression.test.ts guards
      # it. Skip 8.11.x so a later fixed release can still be proposed and tested.
      - dependency-name: "undici"
        versions: ["8.11.x"]

  # GitHub Actions used by the multi-arch build / CI / GHCR publish workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # Note: the bundled HA integration's only Python dep (aiohttp) is declared in
  # HA's manifest.json, which Dependabot's pip ecosystem can't parse — so there
  # is intentionally no pip entry. Add one here if a requirements.txt/pyproject
  # is ever introduced.
